[project]
name = "spotted"
version = "0.1.0"
description = "Spotted backend: business profile extraction, audits and reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pymongo>=4.13",
    "google-genai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Headless Chromium for the JavaScript-rendering check (then: playwright install chromium)
render = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spotted"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
